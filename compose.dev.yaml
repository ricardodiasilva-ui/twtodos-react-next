name: twtodos-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
