<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TWTodos - Lista de tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <main class="container app-shell py-5">
    <header class="mb-4">
      <p class="text-primary fw-semibold mb-2">TWTodos</p>
      <h1 class="display-6 fw-bold">Organize suas tarefas</h1>
      <p class="text-body-secondary mb-0">Adicione, remova e reordene sua lista. As tarefas ficam salvas neste navegador.</p>
    </header>

    <section class="card border-0 shadow-sm" aria-labelledby="tasks-heading">
      <div class="card-body p-4">
        <h2 id="tasks-heading" class="visually-hidden">Minhas tarefas</h2>
        <form id="task-form" class="mb-4" novalidate>
          <label for="task-input" class="form-label fw-semibold">Nova tarefa</label>
          <div class="input-group">
            <input id="task-input" class="form-control" type="text" placeholder="Ex.: Estudar Bootstrap" aria-describedby="task-feedback" autocomplete="off">
            <button id="add-task" class="btn btn-primary px-4" type="submit">Adicionar</button>
          </div>
          <div id="task-feedback" class="invalid-feedback"></div>
        </form>

        <div id="storage-error" class="alert alert-danger d-none" role="alert"></div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h6 mb-0">Sua lista</h2>
          <span id="task-count" class="badge text-bg-light">0 tarefas</span>
        </div>
        <ul id="task-list" class="list-group list-group-flush"></ul>
        <p id="empty-state" class="text-body-secondary text-center py-4 mb-0">Nenhuma tarefa por aqui. Adicione a primeira!</p>
        <p id="task-status" class="visually-hidden" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
